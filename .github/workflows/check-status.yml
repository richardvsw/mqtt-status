name: Check MQTT broker status

on:
  # 2026-08-22: the built-in schedule trigger was removed -- an external
  # cron job already calls this workflow's workflow_dispatch API on its
  # own schedule. Keeping both meant every run fired twice (the
  # workflow's own cron AND the external one), doubling MQTT connection
  # attempts and Cloudflare API calls for zero benefit. workflow_dispatch
  # alone is enough: the external cron is what actually drives this now.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q paho-mqtt
      # MQTT_CHECK_USER/PASS: repo Settings -> Secrets and variables ->
      # Actions -- added 2026-08-22 so the checker can do a real
      # authenticated CONNECT instead of a plain TCP check (see
      # check_and_render.py's own comments for why that matters). Never
      # committed in plaintext.
      - run: python3 check_and_render.py
        env:
          MQTT_CHECK_USER: ${{ secrets.MQTT_CHECK_USER }}
          MQTT_CHECK_PASS: ${{ secrets.MQTT_CHECK_PASS }}
      # 2026-08-22: points mqtt.rivi.my.id at whichever broker is
      # currently healthy (see update_dns.py's own docstring for the
      # full reasoning) -- deliberately only runs here, in GitHub
      # Actions, never on the LXC-side timer. The whole point is that
      # broker selection keeps working even if the homelab itself goes
      # offline; a device's DNS lookup hits Cloudflare directly and
      # never depends on anything we run at home. CLOUDFLARE_API_TOKEN
      # is scoped to DNS-edit on this one zone only.
      - run: python3 update_dns.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      # 2026-09-04: check_bot_status.py now polls the bot's own public
      # API (meshbot.rivi.my.id) directly over HTTPS -- reachable from
      # here just like anywhere else on the internet, so this gets a
      # real live check of mesh_bot/meshtasticd, not an inferred one.
      - run: python3 check_bot_status.py
      - name: Skip publish if the LXC already did recently
        id: guard
        run: |
          # 2026-08-22: the LXC-side timer (deploy/systemd/run_and_push.sh)
          # is the PRIMARY publisher, running every 2 min; this workflow is
          # only meant to be a FALLBACK for when the homelab is offline --
          # that intent was already documented in run_and_push.sh's own
          # comments, but nothing actually enforced it, so this run used
          # to blindly try to publish every ~10 min regardless of whether
          # the LXC had just done the exact same thing seconds earlier.
          # That's the real race: not "pushing collides", but "both sides
          # decide to publish in the same window at all". Skipping here
          # when a recent LXC commit exists fixes the race at its source
          # instead of just retrying around it -- 5 min is comfortably
          # more than double the LXC's own 2-min cadence, so a commit
          # that recent means the LXC is clearly alive and current.
          last_author=$(git log -1 --format='%an')
          last_ts=$(git log -1 --format='%at')
          now=$(date +%s)
          age=$((now - last_ts))
          if [ "$last_author" = "mqtt-status-lxc" ] && [ "$age" -lt 300 ]; then
            echo "LXC published ${age}s ago -- skipping, it's already current"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit broker status if changed (skip if LXC just did)
        if: steps.guard.outputs.skip != 'true'
        # 2026-08-22: GitHub-hosted runners default to UTC, while the
        # LXC-side publisher's commits naturally carry WIB (its system
        # clock is WIB) -- comparing the two in git log meant converting
        # timezones by hand every time. TZ=Asia/Jakarta here makes BOTH
        # the actual commit author/committer date AND the message text
        # consistently WIB, matching the LXC side exactly.
        env:
          TZ: Asia/Jakarta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 2026-08-22: history.json/notice.json were both stale here --
          # history.json was split into history/YYYY-MM.json a while back
          # and notice.json was added, but this list was never updated to
          # match, so a fallback run would have silently failed to commit
          # either.
          # 2026-09-04: bot-status.html/bot_history/bot_state.json/
          # bot_log.jsonl moved to their own unguarded step below -- see
          # that step's own comment for why they can't share this one's
          # guard anymore.
          git add index.html history state.json log.jsonl brokers.json notice.json
          if git diff --cached --quiet; then
            echo "no broker changes to publish"
            exit 0
          fi
          git commit -m "Update broker status $(date +%Y-%m-%dT%H:%M:%S%z) WIB"
          # Retries here now only cover a genuine simultaneous collision
          # (both sides finishing within the same instant) -- the guard
          # step above already eliminates the much larger "any overlap
          # in a 10-min window" case that used to make this fail
          # regularly. 3 is enough margin for that narrow remaining edge
          # case without burning CI time on a scenario that's rare by
          # design now. `-X ours` keeps THIS run's freshly-computed data
          # on conflict, since it's always more current than whatever the
          # other side had.
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "failed to push broker status after 3 attempts"
          exit 1
      # 2026-09-04: unguarded and separate from the broker commit above --
      # check_bot_status.py now polls the bot's own public API directly
      # instead of the LXC pushing these files here itself, so this
      # workflow (on its own ~10-min external-cron schedule) is the ONLY
      # thing that ever publishes them to this repo. Gating them behind
      # "did the LXC just publish broker data" would mean they almost
      # never actually get committed, since the LXC still pushes broker
      # data every 2 min and that window is >=5 min most of the time this
      # workflow runs.
      - name: Commit bot status if changed (always attempted)
        env:
          TZ: Asia/Jakarta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot-status.html bot_history bot_state.json bot_log.jsonl
          if git diff --cached --quiet; then
            echo "no bot status changes to publish"
            exit 0
          fi
          git commit -m "Update bot status $(date +%Y-%m-%dT%H:%M:%S%z) WIB"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "failed to push bot status after 3 attempts"
          exit 1
