name: Check MQTT broker status

on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub's scheduler doesn't guarantee exact timing under load -- 10 min keeps this reliable rather than requesting 5 and getting skipped runs
  workflow_dispatch: {}  # lets you trigger a manual check/refresh from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_and_render.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history.json state.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "Update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
