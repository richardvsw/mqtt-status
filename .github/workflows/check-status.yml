name: Check MQTT broker status

on:
  schedule:
    - cron: "*/10 * * * *"  # GitHub's scheduler doesn't guarantee exact timing under load -- 10 min keeps this reliable rather than requesting 5 and getting skipped runs
  workflow_dispatch: {}  # lets you trigger a manual check/refresh from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q paho-mqtt
      # MQTT_CHECK_USER/PASS: repo Settings -> Secrets and variables ->
      # Actions -- added 2026-08-22 so the checker can do a real
      # authenticated CONNECT instead of a plain TCP check (see
      # check_and_render.py's own comments for why that matters). Never
      # committed in plaintext.
      - run: python3 check_and_render.py
        env:
          MQTT_CHECK_USER: ${{ secrets.MQTT_CHECK_USER }}
          MQTT_CHECK_PASS: ${{ secrets.MQTT_CHECK_PASS }}
      # 2026-08-22: points mqtt.rivi.my.id at whichever broker is
      # currently healthy (see update_dns.py's own docstring for the
      # full reasoning) -- deliberately only runs here, in GitHub
      # Actions, never on the LXC-side timer. The whole point is that
      # broker selection keeps working even if the homelab itself goes
      # offline; a device's DNS lookup hits Cloudflare directly and
      # never depends on anything we run at home. CLOUDFLARE_API_TOKEN
      # is scoped to DNS-edit on this one zone only.
      - run: python3 update_dns.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history.json state.json log.jsonl brokers.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
            exit 0
          fi
          git commit -m "Update status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 2026-08-22: a bare `git push` here failed the whole job (and
          # fired a failure-notification email) every time this run
          # collided with the LXC-side timer's own commit+push, which
          # happens often since that side runs every 2 min. The data
          # this step publishes (index.html/history.json/state.json/
          # log.jsonl/brokers.json) is always freshly regenerated THIS
          # run, so on conflict our own version is the correct one to
          # keep -- `-X ours` resolves every conflicting hunk in favor
          # of what this run just computed, instead of needing a human
          # to pick a side.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i), rebasing onto origin/main and retrying"
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "failed to push after 5 attempts"
          exit 1
